name: Test Pipeline (Full E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        run: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p /opt/miniconda3
          echo "/opt/miniconda3/bin" >> $GITHUB_PATH
          echo "CONDA_HOME=/opt/miniconda3" >> $GITHUB_ENV
          rm miniconda.sh

      - name: Install dependencies via Conda
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda create -y -n genosanger -c conda-forge -c bioconda tracy blast
          conda activate genosanger
          which tracy
          which blastn

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: 26.10.5

      - name: Build BLAST database for testing
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger
          makeblastdb -in data/ompA_test.fasta -dbtype nucl -out data/ompA_test
          echo "BLAST database built successfully"

      - name: Test full pipeline with real SCF data and BLAST
        run: |
          # Initialize conda
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger

          # Get absolute path for database
          DB_PATH="$(cd data && pwd)/ompA_test"

          # Create test samples file with real SCF files from repo (3 valid samples)
          cat > test_samples.tsv << 'EOF'
          sampleId	read1	read2
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          LHMD004	./SangerSequencingChromatograms/LHMD004-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD004-07_R1_1.ab1
          LHMD014	./SangerSequencingChromatograms/LHMD014-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD014-07_R1_1.ab1
          EOF

          # Run full pipeline (Tracy + BLAST) with test database
          nextflow run main.nf \
            --samples_tsv test_samples.tsv \
            --publish_dir ./test_output \
            --db "$DB_PATH" \
            --cpus 2

          echo "Full E2E pipeline completed"

      - name: Verify output files
        run: |
          if [ -f test_output/temp/LHMD002.consensus.fasta ]; then
            echo "✓ Consensus FASTA generated"
          else
            echo "✗ ERROR: Expected consensus file not found"
            exit 1
          fi

          if [ -f test_output/results/concatenatedHits_withHeaders.tsv ]; then
            echo "✓ Concatenated hits file generated"
          else
            echo "✗ ERROR: Expected concatenated hits file not found"
            exit 1
          fi

          # Every hit in the concatenated file must carry its sample ID in the qaccver column
          if [ "$(grep -v '^qaccver' test_output/results/concatenatedHits_withHeaders.tsv | cut -f1 | sort -u | wc -l)" = "3" ]; then
            echo "✓ Concatenated hits carry sample IDs"
          else
            echo "✗ ERROR: Concatenated hits do not carry sample IDs"
            exit 1
          fi

      - name: Test single sample run
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger
          DB_PATH="$(cd data && pwd)/ompA_test"

          # One sample, no duplicates — the original CI baseline
          cat > test_single_samples.tsv << 'EOF'
          sampleId	read1	read2
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          EOF

          nextflow run main.nf \
            --samples_tsv test_single_samples.tsv \
            --publish_dir ./test_single_output \
            --db "$DB_PATH" \
            --cpus 2

          if [ -f test_single_output/results/concatenatedHits_withHeaders.tsv ]; then
            echo "✓ Single sample run works"
          else
            echo "✗ ERROR: Single sample run failed"
            exit 1
          fi

      - name: Test duplicate sample IDs (should fail)
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger
          DB_PATH="$(cd data && pwd)/ompA_test"

          # Duplicate the same sample ID twice
          cat > test_dup_samples.tsv << 'EOF'
          sampleId	read1	read2
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          EOF

          # Without --dedupe_samples, this must fail fast with a clear error
          nextflow run main.nf \
            --samples_tsv test_dup_samples.tsv \
            --publish_dir ./test_dup_output \
            --db "$DB_PATH" \
            --cpus 2 > dup.log 2>&1 || true

          if grep -q "ERROR: Duplicate sample IDs in samples.tsv" dup.log; then
            echo "✓ Duplicate sample IDs rejected without flag"
          else
            echo "✗ ERROR: Duplicate sample IDs were not rejected"
            cat dup.log | tail -20
            exit 1
          fi

      - name: Test duplicate sample IDs with --dedupe_samples (identical reads)
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger
          DB_PATH="$(cd data && pwd)/ompA_test"

          # Duplicate the same sample ID twice, identical reads
          cat > test_dup_samples_identical.tsv << 'EOF'
          sampleId	read1	read2
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          EOF

          # With --dedupe_samples, identical duplicates should be collapsed to one run
          nextflow run main.nf \
            --samples_tsv test_dup_samples_identical.tsv \
            --publish_dir ./test_dup_identical_output \
            --db "$DB_PATH" \
            --cpus 2 --dedupe_samples

          if [ -f test_dup_identical_output/results/concatenatedHits_withHeaders.tsv ]; then
            echo "✓ Duplicate sample IDs with identical reads collapsed to one run"
          else
            echo "✗ ERROR: Duplicate sample IDs were not handled correctly"
            exit 1
          fi

      - name: Test duplicate sample IDs with --dedupe_samples (different reads)
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate genosanger
          DB_PATH="$(cd data && pwd)/ompA_test"

          # Duplicate the same sample ID twice, different reads
          cat > test_dup_samples_different.tsv << 'EOF'
          sampleId	read1	read2
          LHMD002	./SangerSequencingChromatograms/LHMD002-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD002-07_R1_1.ab1
          LHMD002	./SangerSequencingChromatograms/LHMD004-07_F1_1.ab1	./SangerSequencingChromatograms/LHMD004-07_R1_1.ab1
          EOF

          # With --dedupe_samples, differing reads must still fail
          nextflow run main.nf \
            --samples_tsv test_dup_samples_different.tsv \
            --publish_dir ./test_dup_different_output \
            --db "$DB_PATH" \
            --cpus 2 --dedupe_samples > dup_diff.log 2>&1 || true

          if grep -q "ERROR: Sample ID LHMD002 appears multiple times with different reads in samples.tsv" dup_diff.log; then
            echo "✓ Duplicate sample IDs with different reads rejected even with --dedupe_samples"
          else
            echo "✗ ERROR: Duplicate sample IDs with different reads were not rejected"
            cat dup_diff.log | tail -20
            exit 1
          fi

      - name: Cleanup
        run: |
          rm -rf .nextflow/ work/ test_output/ test_single_output/ test_dup_output/ test_dup_identical_output/ test_dup_different_output/ test_samples.tsv test_single_samples.tsv test_dup_samples.tsv test_dup_samples_identical.tsv test_dup_samples_different.tsv
